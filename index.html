<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="printorix-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Filament">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Printorix Filamentlager</title>
<script>try{var t=localStorage.getItem("fl-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: werkstatt-board im Printorix-Look — weisse Fläche, Navy-Kommode, blaue Akzente. Spulen als Draufsicht mit Füllring. */
:root{
  --bg:#FFFFFF; --panel:#F5F7FA; --ink:#1F2937; --muted:#5B6573; --line:#E3E8EF;
  --cab:#1E3A5F; --cab-edge:#152B47; --drawer:#264A73; --drawer-hi:#264A73; --drawer-ink:#FFFFFF; --drawer-muted:#A9C8EA;
  --accent:#2563EB; --accent-ink:#FFFFFF; --accent-soft:#EAF2FD; --brand:#2B77C2; --brand-light:#99CFFF; --navy:#1E3A5F;
  --track:#E3E8EF; --track-on-cab:#1A3554;
  --low:#DC2626; --ok:#16A34A; --warn:#F59E0B;
  --ring:#FF7A00; --ring-line:rgba(0,0,0,.6);
  --display:"Montserrat",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1722; --panel:#172231; --ink:#E6ECF3; --muted:#9AA7B6; --line:#26354A;
  --cab:#13243A; --cab-edge:#0A1524; --drawer:#1C3350; --drawer-hi:#1C3350; --drawer-ink:#E6ECF3; --drawer-muted:#8FB3D9;
  --accent:#4C8DF6; --accent-ink:#FFFFFF; --accent-soft:#1A2F4D; --navy:#99CFFF; --track:#26354A; --track-on-cab:#13243A; --low:#F87171; --ok:#4ADE80; --warn:#FBBF24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1722; --panel:#172231; --ink:#E6ECF3; --muted:#9AA7B6; --line:#26354A;
  --cab:#13243A; --cab-edge:#0A1524; --drawer:#1C3350; --drawer-hi:#1C3350; --drawer-ink:#E6ECF3; --drawer-muted:#8FB3D9;
  --accent:#4C8DF6; --accent-ink:#FFFFFF; --accent-soft:#1A2F4D; --navy:#99CFFF; --track:#26354A; --track-on-cab:#13243A; --low:#F87171; --ok:#4ADE80; --warn:#FBBF24; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0;font-size:15.5px;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:20px}

/* Kopf */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 12px;border-bottom:1px solid var(--line);display:grid;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.brandrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
h1{font-family:var(--display);font-weight:600;font-size:24.5px;letter-spacing:0;line-height:1;margin:0;color:var(--navy);display:flex;align-items:center;gap:12px}
h1 .wordmark{height:24px;width:auto;display:block}
h1 .sep{width:1px;height:22px;background:var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1 .wordmark{filter:brightness(0) invert(1) opacity(.9)}}
:root[data-theme="dark"] h1 .wordmark{filter:brightness(0) invert(1) opacity(.9)}
h1 small{font-family:var(--mono);font-size:12.5px;font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0}
.brandright{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:flex-end}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-variant-numeric:tabular-nums}
.stat{display:grid;line-height:1.1}
.stat b{font-family:var(--display);font-size:24.5px;font-weight:700;color:var(--navy)}
.stat span{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat.low b{color:var(--low)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 260px;position:relative;min-width:0}
.search input{width:100%;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 12px 0 36px}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;stroke:var(--muted)}
.hit{font-family:var(--mono);font-size:13.5px;color:var(--muted);white-space:nowrap}
.hit b{color:var(--accent);font-weight:500}
.btn{height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary:hover{background:#1D4ED8;color:var(--accent-ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:14px}
.btn.danger{color:var(--low)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip i{font-style:normal;font-family:var(--mono);font-size:12.5px;opacity:.7}
.matbar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--track)}
.matbar span{display:block;height:100%}

/* Raster */
.board{display:grid;grid-template-columns:minmax(0,2.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.board{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1180px) and (min-width:981px){.slots.c6{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 8px}
.sect-h h2{font-family:var(--display);font-weight:600;font-size:14.5px;text-transform:uppercase;letter-spacing:.12em;margin:0;color:var(--navy)}
.sect-h .sum{font-family:var(--mono);font-size:13.5px;color:var(--muted)}

/* Kommode */
.cabinet{background:var(--cab);border-radius:10px;padding:12px;border-bottom:10px solid var(--cab-edge);box-shadow:0 14px 28px -20px rgba(30,58,95,.55);display:grid;gap:10px}
.crow{display:grid;gap:10px}
.crow.top{grid-template-columns:repeat(4,minmax(0,1fr))}
.crow.half{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.crow.top{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.crow.half{grid-template-columns:minmax(0,1fr)}}
.drawer{background:var(--drawer);border-radius:6px;padding:20px 10px 10px;position:relative;color:var(--drawer-ink);min-height:120px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.drawer::before{content:"";position:absolute;top:7px;left:50%;translate:-50% 0;width:34%;max-width:90px;height:5px;border-radius:3px;background:var(--cab-edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.drawer .lh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 6px;font-size:13px}
.lh .nm,.lh .meta{white-space:nowrap}
.drawer .lh{flex-wrap:nowrap}
.drawer .lh .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.drawer .lh>span:last-child{flex:none}
.drawer .lh .nm{font-family:var(--display);font-weight:600;font-size:14.5px;letter-spacing:.02em}
.drawer .lh .meta{font-family:var(--mono);font-size:12.5px;color:var(--drawer-muted)}
.drop-on{box-shadow:0 0 0 2px var(--accent) inset}
.loc{border-radius:8px}
.icon-btn{width:26px;height:26px;border-radius:6px;border:0;background:transparent;display:inline-grid;place-items:center;color:inherit;opacity:.65}
.panel .lh{flex-wrap:wrap;row-gap:4px}
.panel .lh .nm{white-space:normal;min-width:0;flex:1 1 auto}
.panel .lh>span:last-child{margin-left:auto}
.printer .slots,.panel .spools{min-width:0}
.slot.drop-slot{border-color:var(--accent);border-style:solid;box-shadow:0 0 0 2px var(--accent) inset}
.icon-btn:disabled{opacity:.2;cursor:default;background:transparent}
.icon-btn:hover{opacity:1;background:rgba(127,127,127,.18)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}

/* Spulen */
.spools{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px 6px}
.spool{border:0;background:transparent;padding:0;display:grid;justify-items:center;gap:3px;position:relative;transition:opacity .15s,transform .15s;min-width:0}
.spool:hover{transform:translateY(-2px)}
.disc{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;position:relative;box-shadow:0 0 0 1px var(--ring-line)}
.disc .fill{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 1px var(--ring-line),inset 0 0 0 1px rgba(0,0,0,.18)}
.disc .fill::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--hub,var(--bg));box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.spool .t{font-size:12px;line-height:1.15;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.spool .w{font-family:var(--mono);font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.spool.low .w{color:var(--low);opacity:1;font-weight:500}
.drawer .spool.low .w{color:#FCA5A5}
.badge{position:absolute;top:-2px;right:calc(50% - 30px);font-family:var(--mono);font-size:10px;font-weight:500;line-height:1;padding:3px 4px;border-radius:4px;background:var(--warn);color:#111}
.spool.dim{opacity:.13}
.spool.match .disc{box-shadow:0 0 0 1px var(--ring-line),0 0 0 3px var(--accent)}
.spool.test .disc .fill{outline:2px dashed var(--warn);outline-offset:2px}
.spool.dragging{opacity:.4}
.zub{display:flex;flex-wrap:wrap;gap:5px}
button.ztag{cursor:pointer}
.ztag{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:inherit;border-radius:5px;padding:3px 7px;font-size:13px}
.ztag.dim{opacity:.18}.ztag.match{border-color:var(--accent)}
.empty{font-size:13.5px;opacity:.55;font-style:italic;padding:6px 2px}

/* Panels (hell) */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.panel .lh{display:flex;justify-content:space-between;align-items:center;gap:6px}
.panel .lh .nm{font-family:var(--display);font-weight:600;font-size:15.5px;letter-spacing:.01em;color:var(--navy)}
.panel .lh .meta{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.stack{display:grid;gap:10px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;min-width:0}
.slots.c1{grid-template-columns:minmax(0,1fr)}.slots.c2{grid-template-columns:repeat(2,minmax(0,1fr))}.slots.c3{grid-template-columns:repeat(3,minmax(0,1fr))}.slots.c6{grid-template-columns:repeat(6,minmax(0,1fr))}
.drawer .slot{border-color:rgba(255,255,255,.14);min-height:80px}
.drawer .slot.filled{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.03)}
.drawer .slot .no{color:var(--drawer-muted)}
.slot .spool .t{max-width:calc(100% - 6px);white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;text-overflow:clip}
.slot{padding:6px 2px}
.ztag.addz{border-style:dashed;opacity:.7;cursor:pointer}
.ztag.addz:hover{opacity:1}
.panel .ztag{border-color:var(--line);background:var(--bg)}
.zub:empty{display:none}
.printer .slots.free{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
.slot{border:1px dashed var(--line);border-radius:8px;min-height:84px;display:grid;place-items:center;padding:4px 0}
.slot.filled{border-style:solid}
.slot .no{font-family:var(--mono);font-size:11px;color:var(--muted)}
.floor{display:grid;gap:10px}
.floor .panel .spools{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
.floor-row{position:relative}
.floor-row .panel{border-left:4px solid var(--brand-light)}

/* Bestellen */
.order-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.order-list li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:7px;background:var(--bg)}
.sw{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.order-list .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-list .q{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.order-list .acts{display:flex;gap:4px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 58px auto;gap:6px}
.addrow input{height:32px;border-radius:7px;border:1px solid var(--line);background:var(--bg);padding:0 8px;min-width:0}
.sugg{display:flex;flex-wrap:wrap;gap:5px}
.sugg button{border:1px dashed var(--low);color:var(--low);background:transparent;border-radius:999px;padding:2px 9px;font-size:13px}
.note{font-size:13.5px;color:var(--muted)}

/* Status */
.banner{padding:10px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:14.5px}
.banner.err{border-color:var(--low)}

/* Editor */
.scrim{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(430px,100%);height:100%;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:grid;gap:14px;align-content:start;box-shadow:-20px 0 40px -20px rgba(0,0,0,.4)}
.sheet h3{font-family:var(--display);font-size:22.5px;font-weight:700;color:var(--navy);margin:0;display:flex;align-items:center;gap:12px}
.field{display:grid;gap:5px}
.field label,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{height:38px;border-radius:7px;border:1px solid var(--line);background:var(--bg);padding:0 10px;width:100%;min-width:0}
.field textarea{height:64px;padding:8px 10px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.palette button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.palette button[aria-pressed="true"]{border-color:var(--accent)}
.palette input[type=color]{width:24px;height:24px;border:0;padding:0;background:none;border-radius:50%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.weight-big{display:flex;align-items:center;gap:14px}
.weight-big .disc{width:76px;height:76px}.weight-big .disc .fill{width:58px;height:58px}.weight-big .disc .fill::after{width:18px;height:18px}
.quick{display:flex;flex-wrap:wrap;gap:5px}
input[type=range]{width:100%;accent-color:var(--accent)}
.sheet .actions{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.confirm{display:flex;gap:8px;align-items:center;font-size:14.5px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:#1F2937;border:1px solid rgba(153,207,255,.35);color:#fff;padding:10px 16px;border-radius:999px;font-size:14.5px;z-index:60;box-shadow:0 8px 24px rgba(15,23,34,.3);display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{border:0;background:transparent;color:var(--brand-light);font-weight:600;padding:0;white-space:nowrap}

/* Treffer-Liste & Handy-Bedienelemente (Desktop: aus) */
#results,.tabs,.fab{display:none}
.brandrow .stats{margin-left:auto}
.wrap>*,header.top>*,.brandrow>*,.toolbar>*{min-width:0}
h1{flex-wrap:wrap}
.results{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rrow{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px}
.rrow .disc{width:40px;height:40px}.rrow .disc .fill{width:30px;height:30px}.rrow .disc .fill::after{width:10px;height:10px}
.rrow .a{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .b{font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .g{font-family:var(--mono);font-size:14.5px;font-variant-numeric:tabular-nums;text-align:right}
.rrow .g.low{color:var(--low)}
.rrow .tq{font-family:var(--mono);font-size:10px;background:var(--warn);color:#111;border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:2px}
@media (max-width:760px){
  body{padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
  header.top{position:static;border-bottom:0;padding-block:12px 4px;gap:10px}
  .brandrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
  .brandrow>*{width:100%;max-width:100%}
  .brandrow>.menu{width:auto;grid-column:2;grid-row:1}
  .brandrow>h1{grid-column:1;grid-row:1}
  .brandrow>.stats{grid-column:1/-1;grid-row:2;margin-left:0}
  h1 .wordmark{height:17px}h1 .sep{height:18px}
  h1{font-size:20px;gap:9px}
  h1 small{flex-basis:100%}
  .stats{flex-wrap:nowrap;overflow-x:auto;gap:8px;scrollbar-width:none}
  .stats::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
  .stat{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .stat b{font-size:22.5px}
  .toolbar{gap:8px}
  .search{flex:1 1 100%}
  .search input{height:46px;font-size:18px;border-radius:12px}
  .search svg{top:14px}
  #addBtn{display:none}
  #addZub{height:44px;border-radius:12px;flex:1 1 auto;justify-content:center}
  .hist{height:44px;border-radius:12px}.hist button{width:52px}
  .hit{order:9;flex-basis:100%}
  .hit:empty{display:none}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-right:16px}
  .chip{flex:none;height:34px;padding:0 13px;font-size:14.5px}
  .board{gap:14px}
  section[data-sec]:not(.on){display:none}
  body.searching section[data-sec]{display:none}
  body.searching #results{display:block}
  .crow.top{grid-template-columns:repeat(2,minmax(0,1fr))}
  .crow.half{grid-template-columns:minmax(0,1fr)}
  .slots.c6{grid-template-columns:repeat(4,minmax(0,1fr))}
  .crow.top .drawer{padding:18px 8px 8px}
  .crow.top .drawer .icon-btn{width:30px;height:30px}
  .crow.top .drawer [data-add]{display:none}
  .crow.top .drawer .lh .nm{font-size:15px}
  .crow.top .slot .disc{width:46px;height:46px}.crow.top .slot .disc .fill{width:35px;height:35px}
  .crow.top .slot{min-height:76px}
  .cabinet{padding:8px;gap:8px;border-bottom-width:6px}
  .drawer{min-height:0;padding:18px 12px 12px}
  .spools,.printer .slots.free,.floor .panel .spools{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:12px 6px}
  .disc{width:54px;height:54px}.disc .fill{width:41px;height:41px}
  .spool .t{font-size:13px}.spool .w{font-size:12.5px}
  .icon-btn{width:36px;height:36px}
  .panel .lh .nm{font-size:18px}
  .addrow{grid-template-columns:minmax(0,1fr) 56px}
  .addrow .btn{grid-column:1/-1;height:40px}
  .addrow input{height:42px;font-size:18px}
  .order-list li{padding:10px}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:3px;padding:6px 0;font-size:12.5px;font-weight:600;color:var(--muted);position:relative;border-radius:10px}
  .tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tabs button[aria-current="true"]{color:var(--accent)}
  body.searching .tabs button[aria-current="true"]{color:var(--muted)}
  .tb{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--low);color:#fff;font-size:11px;line-height:17px}
  .fab{display:grid;place-items:center;position:fixed;z-index:41;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -8px rgba(0,0,0,.45)}
  .fab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.6}
  .scrim{align-items:flex-end}
  .sheet{width:100%;height:auto;max-height:92%;border-radius:18px 18px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
  .sheet::before{content:"";justify-self:center;width:40px;height:5px;border-radius:3px;background:var(--line)}
  .field input,.field select,.field textarea{height:46px;font-size:18px}
  .quick .btn{height:40px;flex:1}
  .palette button{width:32px;height:32px}
  .sheet .actions{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));background:var(--panel);padding-bottom:8px}
  .sheet .actions .btn{flex:1 1 auto;justify-content:center;height:46px}
  .toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Rückgängig / Wiederholen */
.hist{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:40px;flex:none}
.hist button{width:40px;border:0;background:var(--bg);display:grid;place-items:center;color:var(--ink)}
.hist button+button{border-left:1px solid var(--line)}
.hist button:hover:not(:disabled){color:var(--accent);background:var(--accent-soft)}
.hist button:disabled{opacity:.3;cursor:default}
.hist svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* Menü hinter dem Printorix-Icon */
.menu{position:relative;flex:none}
.menuBtn{width:44px;height:44px;border-radius:50%;padding:0;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;transition:box-shadow .15s}
.menuBtn img{width:100%;height:100%;display:block}
.menuBtn:hover,.menuBtn[aria-expanded="true"]{box-shadow:0 0 0 3px var(--brand-light)}
.menuPop{position:absolute;right:0;top:calc(100% + 8px);z-index:30;min-width:230px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px -12px rgba(15,23,34,.35);padding:6px;display:grid}
.menuPop .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menuPop button{height:40px;border:0;background:transparent;border-radius:8px;text-align:left;padding:0 10px;display:flex;align-items:center;gap:10px;font-weight:500}
.menuPop button:hover{background:var(--accent-soft);color:var(--accent)}
.menuPop button.danger{color:var(--low)}
.switch{margin-left:auto;width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch span{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
[aria-checked="true"] .switch{background:var(--ring)}
[aria-checked="true"] .switch span{transform:translateX(16px)}
.menuPop svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* Login */
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:24px}
.gate-card{width:min(380px,100%);display:grid;gap:16px;justify-items:start}
.gate-card h1{font-size:29px}
.gate-card .gateLogo{width:84px;height:84px;border-radius:50%}
.gate-card p{margin:0;color:var(--muted)}
.gbtn{height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600;display:inline-flex;align-items:center;gap:10px}
.gbtn svg{width:18px;height:18px}
.gate .err{color:var(--low);font-size:14.5px}
.who{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
</style>

</head>

      <button class="btn" id="addZub"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>Zubehör</button>

      <div class="cabinet">
        <div class="crow top" id="rowTop"></div>

    <button class="gbtn" id="loginBtn"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Mit Google anmelden</button>

<nav class="tabs" id="tabs" aria-label="Bereiche">

  <button data-tab="drucker"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2"/><rect x="6" y="14" width="12" height="7"/></svg>Drucker</button>

<script>
(() => {
const LOCS = [
  {id:'bodenS',name:'Reihe 1 · Schwarz',zone:'floor'},{id:'bodenW',name:'Reihe 2 · Weiss',zone:'floor'},
  {id:'neu',name:'Noch einzuordnen',zone:'inbox'},{id:'bestellt',name:'In Bestellung',zone:'inbox'}
];
const DEFAULT_DRAWERS = [1,2,3,4,5,6,7,8].map(n=>({id:'s'+n, name:'Schublade '+n, slots: n<=4?4:12}));
const drawerZone = id => ({s1:'top',s2:'top',s3:'top',s4:'top',s5:'mid',s6:'mid',s7:'bot',s8:'bot'})[id];
const DEFAULT_PRINTERS = [
  {id:'h2s',name:'Bambu Lab H2S · AMS',slots:4},{id:'h2s2',name:'H2S · Zusatz',slots:0},
  {id:'h2d',name:'Bambu Lab H2D · AMS',slots:0},{id:'a1',name:'Bambu Lab A1 mini',slots:4},
  {id:'dry',name:'Sovol Filamenttrockner',slots:0}
];
const locs = () => [...state.drawers.map(d=>({...d,zone:drawerZone(d.id),drawer:true})), ...state.printers.map(p=>({...p,zone:'printer'})), ...LOCS.filter(l=>['floor','inbox'].includes(l.zone))];
const MATS = ['PLA','PETG','PCTG','ABS','ASA','TPU','PA','PC','Resin'];
const BRANDS = ['Bambu Lab','3DJake','Extrudr','Prusament','Polymaker','eSun','Sunlu','Elegoo'];
const COLORS = [['Schwarz','#1c1c1e'],['Weiss','#f4f4f2'],['Grau','#8a8d90'],['Rot','#d0312d'],['Orange','#f28b2c'],['Gelb','#f5c518'],['Gold','#c9a227'],['Beige','#d9c6a5'],['Braun','#7a4b2a'],['Holz','#a87b4f'],['Olivgrün','#6b7a3a'],['Grün','#2e9e4f'],['Hellgrün','#8fd16a'],['Türkis','#1fb5ad'],['Blau','#2c62c9'],['Muted Blue','#6d86a3'],['Army Blue','#3e4f5f'],['Pink','#f08bb4'],['Marmor','#cfcac2'],['Klar','#dfeaf0'],['Rainbow','rainbow']];
const COLOR_KEYS = [['MUTED BLUE','Muted Blue'],['ARMY BLUE','Army Blue'],['OLIV','Olivgrün'],['HELLGRÜN','Hellgrün'],['WOOD','Holz'],['HOLZ','Holz'],['MARBLE','Marmor'],['MARMOR','Marmor'],['TÜRKIS','Türkis'],['PINK','Pink'],['WEISS','Weiss'],['WHITE','Weiss'],['GRAU','Grau'],['GREY','Grau'],['SCHWARZ','Schwarz'],['BLACK','Schwarz'],['GELB','Gelb'],['YELLOW','Gelb'],['ROT','Rot'],['RED','Rot'],['BEIGE','Beige'],['GOLD','Gold'],['BRAUN','Braun'],['RAINBOW','Rainbow'],['BLAU','Blau'],['BLUE','Blau'],['ORANGE','Orange'],['CLEAR','Klar'],['KLAR','Klar'],['GRÜN','Grün'],['GREEN','Grün']];
const MAT_COLORS = {PLA:'#4c6ef5',PETG:'#e8590c',PCTG:'#ae3ec9',ABS:'#2f9e44',ASA:'#0c8599',TPU:'#f59f00',PA:'#868e96',PC:'#495057',Resin:'#c2255c'};
const LOW = 150;

const state = { spools:new Map(), reorder:new Map(), names:{}, printers:DEFAULT_PRINTERS.map(p=>({...p})), drawers:DEFAULT_DRAWERS.map(d=>({...d})), drawersStored:false, q:'', mat:null, qual:'alle', loaded:false };
let db = null;
const $ = (s,el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kg = g => g >= 1000 ? (g/1000).toLocaleString('de-CH',{maximumFractionDigits:2}) + ' kg' : Math.round(g) + ' g';
const locName = id => { const pr = state.printers.find(p=>p.id===id); if (pr) return pr.name; const dr = state.drawers.find(d=>d.id===id); if (dr) return (!state.drawersStored && state.names[id]) || dr.name; return state.names[id] || (LOCS.find(l=>l.id===id)||{}).name || id; };
const hexOf = c => (COLORS.find(x=>x[0].toLowerCase()===String(c||'').toLowerCase())||[])[1] || '';
const newId = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function parseLabel(txt){
  const U = txt.toUpperCase();
  const material = MATS.find(m => new RegExp('\\b'+m.toUpperCase()+'\\b').test(U)) || '';
  const ck = COLOR_KEYS.find(([k]) => U.includes(k)); const color = ck ? ck[1] : '';
  const brand = /BAMBU/.test(U) ? 'Bambu Lab' : /3DJ/.test(U) ? '3DJake' : /EXTR/.test(U) ? 'Extrudr' : (BRANDS.find(b=>U.includes(b.toUpperCase()))||'');
  const fin = []; [['GLANZ','Glanz'],['MATT','Matt'],['TRANSP','Transparent'],['SILK','Silk'],['BASIC','Basic'],['FOAMY','Foamy']].forEach(([k,v])=>{ if(U.includes(k)) fin.push(v); });
  return {material,color,hex:hexOf(color),brand,finish:fin.join(' ')};
}
function fillCss(s){
  const h = s.hex || hexOf(s.color) || '#999';
  if (h === 'rainbow') return 'conic-gradient(#e03131,#f08c00,#fab005,#40c057,#228be6,#7048e8,#e03131)';
  if (/transp|klar/i.test((s.finish||'')+' '+(s.color||''))) return `repeating-linear-gradient(45deg,${h} 0 4px,color-mix(in srgb,${h} 55%,transparent) 4px 8px)`;
  return h;
}
function pct(s){ const full = +s.full || 1000; return Math.max(0, Math.min(1, (+s.weight||0)/full)); }
function discHtml(s, onCab){
  const p = Math.round(pct(s)*100);
  const track = onCab ? 'var(--track-on-cab)' : 'var(--track)';
  const ring = 'var(--ring)';
  return `<span class="disc" style="background:conic-gradient(${ring} ${p}%, ${track} 0)"><span class="fill" style="background:${fillCss(s)};--hub:${onCab?'var(--drawer)':'var(--panel)'}"></span></span>`;
}
function label(s){ return [s.material, s.color].filter(Boolean).join(' ') || s.name || 'Rolle'; }
function title(s){ return [s.material,s.color,s.finish,s.brand].filter(Boolean).join(' · ') + ` — ${s.weight} g` + (s.quality==='test'?' · TEST':''); }

// --- Filter
const SYN = {schwarz:'black',weiss:'white',grau:'grey gray',rot:'red',blau:'blue','muted blue':'blau','army blue':'blau',grün:'green gruen',hellgrün:'grün green lightgreen hellgruen',olivgrün:'grün olive green olivgruen',gelb:'yellow',orange:'',braun:'brown',beige:'',gold:'',pink:'rosa',türkis:'turquoise teal tuerkis',holz:'wood',marmor:'marble',klar:'clear transparent natur',rainbow:'regenbogen multicolor',
  matt:'matte',glanz:'glossy gloss shiny',transparent:'transp clear',silk:'seide'};
const norm = t => String(t||'').toLowerCase().replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue');
function words(){ return norm(state.q).split(/\s+/).filter(Boolean); }
function hay(s){
  const base = [s.name,s.material,s.color,s.brand,s.finish,s.note,locName(s.loc),s.quality==='test'?'test':'gut',s.kind==='zubehoer'?'zubehör':'filament'].join(' ').toLowerCase();
  const extra = [s.color,...String(s.finish||'').split(/\s+/)].map(x=>SYN[String(x||'').toLowerCase()]||'').join(' ');
  const t = norm(base+' '+extra); return t+' '+t.replace(/[\s.\-]/g,'');
}
function matches(s){
  if (s.kind==='zubehoer') { const w=words(); return !state.mat && state.qual==='alle' && (!w.length || w.every(x=>hay(s).includes(x))); }
  if (state.mat && s.material !== state.mat) return false;
  if (state.qual !== 'alle' && (s.quality||'gut') !== state.qual) return false;
  const w = words(); return !w.length || w.every(x => hay(s).includes(x));
}
const filtering = () => !!(state.q.trim() || state.mat || state.qual!=='alle');
function inLoc(id){ return [...state.spools.values()].filter(s=>s.loc===id).sort((a,b)=>(a.pos??0)-(b.pos??0)); }
const fil = arr => arr.filter(s=>s.kind!=='zubehoer');
const sumG = arr => fil(arr).reduce((a,s)=>a+(+s.weight||0),0);

// --- Render
function spoolBtn(s,onCab){
  const cls = ['spool']; if (s.weight<=LOW) cls.push('low'); if (s.quality==='test') cls.push('test');
  if (filtering()) cls.push(matches(s)?'match':'dim');
  return `<button class="${cls.join(' ')}" draggable="true" data-id="${esc(s.id)}" title="${esc(title(s))}">${discHtml(s,onCab)}${s.quality==='test'?'<span class="badge">TEST</span>':''}<span class="t">${esc(label(s))}</span><span class="w">${s.weight} g</span></button>`;
}

// --- Verlauf: die letzten 2 Schritte rückgängig / wiederholen (gilt für diese Sitzung)
const HIST_MAX = 2;
const hist = {undo:[], redo:[], cur:null};
const clone = v => v==null ? null : JSON.parse(JSON.stringify(v));
const stable = v => JSON.stringify(v, (k,x) => x && typeof x==='object' && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map(n=>[n,x[n]])) : x);
function curStep(){ if (!hist.cur){ hist.cur = {ops:new Map(), label:null, focus:null}; setTimeout(commitStep,0); } return hist.cur; }
function rec(col, id, before, after){
  const c = curStep(), k = col+'|'+id, o = c.ops.get(k);
  if (o) o.after = clone(after); else c.ops.set(k, {col, id, before:clone(before), after:clone(after)});
}
// Beschriftung für den nächsten Schritt (optional): Text und/oder die Rolle, um die es geht
function stepLabel(label, focus){ const c = curStep(); if (label) c.label = label; if (focus) c.focus = focus; }
function commitStep(){
  const c = hist.cur; hist.cur = null; if (!c) return;
  const ops = [...c.ops.values()].filter(o => stable(o.before) !== stable(o.after));
  if (!ops.length) return;
  hist.undo.push({ops, label: c.label || describe(ops, c.focus)});
  while (hist.undo.length > HIST_MAX) hist.undo.shift();
  hist.redo = []; updHist();
}
const nameOf = s => s.kind==='zubehoer' ? (s.name||'Zubehör') : label(s);
function describeOne(o){
  const b=o.before, a=o.after, s=a||b;
  if (o.col==='reorder') return !b ? `${s.name} auf die Bestellliste` : !a ? `${s.name} von der Bestellliste entfernt` : `${s.name} (Bestellliste) geändert`;
  if (o.col==='meta') return o.id==='printers' ? 'Geräte geändert' : o.id==='drawers' ? 'Schubladen geändert' : 'Umbenannt';
  const n = nameOf(s);
  if (!b) return `${n} hinzugefügt (${locName(a.loc)})`;
  if (!a) return `${n} gelöscht`;
  if (b.loc!==a.loc) return `${n}: ${locName(b.loc)} → ${locName(a.loc)}${+a.slot && slotted(a.loc) ? ' · Slot '+a.slot : ''}`;
  if (+b.weight!==+a.weight) return `${n}: ${b.weight} g → ${a.weight} g`;
  if ((+b.slot||0)!==(+a.slot||0)) return `${n}: Slot ${+b.slot||'–'} → Slot ${+a.slot}`;
  if ((b.quality||'gut')!==(a.quality||'gut')) return `${n}: Qualität ${b.quality||'gut'} → ${a.quality||'gut'}`;
  if (+b.full!==+a.full) return `${n}: Rollengrösse ${b.full} g → ${a.full} g`;
  if ((b.pos??0)!==(a.pos??0)) return `${n}: Reihenfolge in ${locName(a.loc)}`;
  return `${n} bearbeitet`;
}
function describe(ops, focus){
  const main = (focus && ops.find(o=>o.id===focus)) || ops.find(o=>o.col==='spools' && (!o.before || !o.after || o.before.loc!==o.after.loc)) || ops[0];
  const rest = ops.filter(o=>o!==main);
  if (!rest.length) return describeOne(main);
  const swapped = rest.filter(o=>o.col==='spools' && o.before && o.after && o.before.loc===o.after.loc && (+o.before.slot||0)!==(+o.after.slot||0));
  if (swapped.length===1 && rest.length===1) return describeOne(main) + ` (getauscht mit ${nameOf(swapped[0].after)})`;
  return describeOne(main) + ` (+${rest.length} weitere)`;
}
function applyVal(col, id, v){
  const write = async () => {
    if (col==='spools' || col==='reorder'){ const ref = db.collection(col).doc(id); if (v){ const {id:_,...body} = v; await ref.set(body); } else await ref.delete(); }
    else if (id==='printers') await db.doc('meta/printers').set({list:v});
    else if (id==='drawers') await db.doc('meta/drawers').set({list:v});
    else if (id==='names') await db.doc('meta/names').set(v||{});
  };
  if (col==='spools' || col==='reorder'){ const m = col==='spools' ? state.spools : state.reorder; if (v) m.set(id, clone(v)); else m.delete(id); }
  else if (id==='printers') state.printers = clone(v);
  else if (id==='drawers'){ state.drawers = clone(v); state.drawersStored = true; }
  else if (id==='names') state.names = clone(v)||{};
  write().catch(e => toast('Speichern fehlgeschlagen: '+(e.code||e.message)));
}
function travel(dir){
  if (!db) return;
  if (hist.cur) commitStep();
  const from = dir<0 ? hist.undo : hist.redo, to = dir<0 ? hist.redo : hist.undo;
  const step = from.pop(); if (!step) return;
  step.ops.forEach(o => applyVal(o.col, o.id, dir<0 ? o.before : o.after));
  to.push(step); while (to.length > HIST_MAX) to.shift();
  render(); updHist();
  toast((dir<0 ? 'Rückgängig: ' : 'Wiederholt: ') + step.label, {label: dir<0 ? 'Wiederholen' : 'Rückgängig', fn: () => travel(-dir)});
}
function updHist(){
  const u = hist.undo[hist.undo.length-1], r = hist.redo[hist.redo.length-1];
  const ub = $('#undoBtn'), rb = $('#redoBtn');
  ub.disabled = !u; rb.disabled = !r;
  ub.title = u ? 'Rückgängig: '+u.label : 'Nichts zum Rückgängigmachen'; ub.setAttribute('aria-label', ub.title);
  rb.title = r ? 'Wiederholen: '+r.label : 'Nichts zum Wiederholen'; rb.setAttribute('aria-label', rb.title);
}

$('#addZub').addEventListener('click', () => openSheet({id:newId('z'),kind:'zubehoer',name:'',qty:'',loc:'s8',pos:Date.now()}));
$('#backupBtn').addEventListener('click', () => {
  const out = {exported:new Date().toISOString(), spools:[...state.spools.values()], reorder:[...state.reorder.values()], names:state.names, printers:state.printers, drawers:state.drawers};
  saveFile(`filamentlager-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(out,null,1), 'application/json');
});
$('#importBtn').addEventListener('click', () => $('#importFile').click());
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value=''; if(!f || !db) return;
  let data; try { data = JSON.parse(await f.text()); } catch(_){ return toast('Datei ist kein gültiges JSON'); }
  const spools = Array.isArray(data) ? data : (data.spools||[]); const reorder = Array.isArray(data) ? [] : (data.reorder||[]);
  const writes = [...spools.map(s=>['spools',s]), ...reorder.map(r=>['reorder',r])].filter(([,x])=>x && x.id);
  if (!writes.length) return toast('Keine Einträge in der Datei gefunden');
  const nNew = spools.filter(s=>s&&s.id).length;
  const ask = (msg) => new Promise(res => {
    $('#status').innerHTML = `<div class="banner" style="display:grid;gap:10px"><div>${msg}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm primary" id="impYes">Ersetzen</button><button class="btn sm" id="impNo">Abbrechen</button></div></div>`;
    $('#impYes').onclick = () => { $('#status').innerHTML=''; res(true); };
    $('#impNo').onclick = () => { $('#status').innerHTML=''; res(false); };
    window.scrollTo({top:0});
  });
  let removeIds = [];
  if (!Array.isArray(data) && data.replace === true && state.spools.size){
    const keep = new Set(spools.map(s=>String(s.id)));
    removeIds = [...state.spools.keys()].filter(id=>!keep.has(id));
    const ok = await ask(`Diese Datei <b>ersetzt den ganzen Bestand</b>: ${state.spools.size} aktuelle Einträge werden durch ${nNew} Einträge aus der Datei ersetzt. Die Bestellliste bleibt erhalten.`);
    if (!ok) return toast('Import abgebrochen');
  }
  const ops = [...removeIds.map(id=>['del','spools',id]), ...writes.map(([c,x])=>['set',c,x])];
  try {
    for (let i=0;i<ops.length;i+=400){ const b=db.batch(); ops.slice(i,i+400).forEach(([op,c,x])=>{ if(op==='del') b.delete(db.collection(c).doc(x)); else { const {id,...body}=x; b.set(db.collection(c).doc(String(id)), body); } }); await b.commit(); }
    if (data.names && Object.keys(data.names).length) await db.doc('meta/names').set(data.names);
    if (Array.isArray(data.printers) && data.printers.length) await db.doc('meta/printers').set({list:data.printers});
    if (Array.isArray(data.drawers) && data.drawers.length) await db.doc('meta/drawers').set({list:data.drawers});
    hist.undo=[]; hist.redo=[]; updHist();
    toast(removeIds.length ? `Bestand ersetzt: ${nNew} Einträge` : `${writes.length} Einträge importiert`);
  } catch(err){ toast('Import fehlgeschlagen: '+(err.code||err.message)); }
});

// Drag & Drop (Desktop) – mobil über «Ort» im Editor
let dragId = null;
document.addEventListener('dragstart', e => { const b=e.target.closest('[data-id]'); if(!b) return; dragId=b.dataset.id; b.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',dragId);}catch(_){} });
document.addEventListener('dragend', () => { dragId=null; document.querySelectorAll('.drop-on,.dragging,.drop-slot').forEach(x=>x.classList.remove('drop-on','dragging','drop-slot')); });
document.addEventListener('dragover', e => { const l=e.target.closest('.loc'); if(!l||!dragId) return; e.preventDefault(); document.querySelectorAll('.drop-slot').forEach(x=>x.classList.remove('drop-slot')); e.target.closest('[data-slot]')?.classList.add('drop-slot'); document.querySelectorAll('.drop-on').forEach(x=>x!==l&&x.classList.remove('drop-on')); l.classList.add('drop-on'); });
document.addEventListener('drop', e => {
  const l=e.target.closest('.loc'); if(!l||!dragId) return; e.preventDefault(); const s=state.spools.get(dragId); if(!s) return; stepLabel(null, s.id);
  const sl=e.target.closest('[data-slot]');
  if (sl && s.kind!=='zubehoer'){ const p=slotted(sl.dataset.sloc); if(p){ setSlot(s.id, p.id, +sl.dataset.slot); toast(`→ ${locName(p.id)} · Slot ${sl.dataset.slot}`); return; } }
  const t=e.target.closest('[data-id]');
  if (t && t.dataset.id!==s.id && !slotted(l.dataset.loc)){ insertBefore(s.id, t.dataset.id); if (s.loc!==l.dataset.loc) toast(`→ ${locName(l.dataset.loc)}`); return; }
  if (s.loc!==l.dataset.loc){ const p=slotted(l.dataset.loc); if (p){ const free=slotLayout(p).indexOf(null); setSlot(s.id, p.id, free>=0?free+1:slotLayout(p).length+1); } else put({...s,loc:l.dataset.loc,slot:0,pos:Date.now()}); toast(`→ ${locName(l.dataset.loc)}`); }
});

let tt; function toast(m, act, ms){ $('#toastHost').innerHTML=`<div class="toast" role="status"><span>${esc(m)}</span>${act?`<button type="button" id="toastAct">${esc(act.label)}</button>`:''}</div>`; if(act) $('#toastAct').onclick=()=>{ $('#toastHost').innerHTML=''; act.fn(); }; clearTimeout(tt); tt=setTimeout(()=>$('#toastHost').innerHTML='', ms || (act?4500:2200)); }

// --- Handy: Treffer-Liste, Tabs, Mehr-Menü
function renderResults(){
  if (!filtering()){ $('#results').innerHTML=''; return; }
  const order = Object.fromEntries(locs().map((l,i)=>[l.id,i]));
  const m = [...state.spools.values()].filter(matches).sort((a,b)=>(order[a.loc]??99)-(order[b.loc]??99)||(a.pos??0)-(b.pos??0));
  const f = fil(m);
  $('#results').innerHTML = `<div class="sect-h"><h2>Treffer</h2><span class="sum">${f.length} Rollen · ${kg(sumG(m))}</span></div>` +
    (m.length ? `<ul class="results">${m.map(s=> s.kind==='zubehoer'
      ? `<li><button class="rrow" data-id="${esc(s.id)}"><span></span><span style="min-width:0"><div class="a">${esc(s.name)}</div><div class="b">Zubehör · ${esc(locName(s.loc))}</div></span><span class="g">${esc(s.qty||'')}</span></button></li>`
      : `<li><button class="rrow" data-id="${esc(s.id)}">${discHtml(s,false)}<span style="min-width:0"><div class="a">${esc(label(s))}${s.quality==='test'?'<span class="tq">TEST</span>':''}</div><div class="b">${esc([s.finish,s.brand].filter(Boolean).join(' · '))}${(s.finish||s.brand)?' · ':''}${esc(locName(s.loc))}</div></span><span class="g${s.weight<=LOW?' low':''}">${s.weight} g</span></button></li>`).join('')}</ul>`
      : '<div class="banner">Keine Treffer. Suchbegriff oder Filter anpassen.</div>');
}
let tab = 'kommode'; try { tab = localStorage.getItem('fl-tab') || 'kommode'; } catch(_){}
function applyTab(){
  document.querySelectorAll('section[data-sec]').forEach(s=>s.classList.toggle('on', s.dataset.sec===tab));
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===tab));
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  tab = b.dataset.tab; try{ localStorage.setItem('fl-tab',tab); }catch(_){}
  if (filtering()){ state.q=''; $('#q').value=''; state.mat=null; state.qual='alle'; render(); }
  applyTab(); window.scrollTo({top:0});
});
// --- Printorix-Menü (Backup, Import, Abmelden)
const menuOpen = o => { $('#menuPop').hidden = !o; $('#menuBtn').setAttribute('aria-expanded', o); };
$('#menuBtn').addEventListener('click', e => { e.stopPropagation(); menuOpen($('#menuPop').hidden); });
$('#menuPop').addEventListener('click', e => { if (e.target.closest('button') && !e.target.closest('#themeBtn')) menuOpen(false); });
// Dunkelmodus ein/aus (wird pro Gerät gespeichert)
const isDark = () => { const t = document.documentElement.getAttribute('data-theme'); return t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
function syncTheme(){ $('#themeBtn').setAttribute('aria-checked', isDark()); const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', isDark()?'#0F1722':'#FFFFFF'); }
$('#themeBtn').addEventListener('click', () => { const t = isDark() ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', t); try{ localStorage.setItem('fl-theme', t); }catch(_){} syncTheme(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', syncTheme);
syncTheme();
document.addEventListener('click', e => { if (!e.target.closest('#menu')) menuOpen(false); });
document.addEventListener('keydown', e => {
  if (e.key==='Escape') menuOpen(false);
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || editing;
  if (!typing && (e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); travel(e.shiftKey ? 1 : -1); }
  if (!typing && (e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); travel(1); }
});
$('#undoBtn').addEventListener('click', () => travel(-1));
$('#redoBtn').addEventListener('click', () => travel(1));
$('#fab').addEventListener('click', () => openSheet(blank(tab==='drucker'?'neu':'neu')));
applyTab();

render(); connect();
})();
</script>
